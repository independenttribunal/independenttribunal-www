name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Check exported pages and preserve the domain
        run: |
          test -s dist/client/index.html
          test -s dist/client/site-shell.css
          test -s dist/client/about.html
          test -s dist/client/llms.txt
          test -s dist/client/data/index.json
          test -s dist/client/legal/index.html
          test -s dist/client/uk-timeline/index.html
          test -s dist/client/research/index.html
          test -s dist/client/research/palestine-action/index.html
          test -s dist/client/data/collections/palestine-action.json
          test -s dist/client/publications/Cage-NGO-Putting-Bodies-On-The-Line.pdf
          node --test tests/palestine-action.test.mjs
          test -s dist/client/data/research.json
          test -s dist/client/research/roger-hallam/index.html
          test -s dist/client/research/sean-middlebrough/index.html
          test -s dist/client/data/profiles/sean-middlebrough.json
          test -s dist/client/data/profiles/roger-hallam.json
          for study in super-injunctions anonymity-orders jigsaw-identification; do
            test -s "dist/client/research/$study/index.html"
            test -s "dist/client/data/profiles/$study.json"
          done
          test -s dist/client/research/mental-health-uk/index.html
          test -s dist/client/data/commentary/mental-health-uk.json
          test -s dist/client/images/mental-health-uk/inverse-catch-22.png
          for dossier in barclays5 filton6 terrorist-connection proscription-litigation hunger-strikes prairieland; do
            test -s "dist/client/research/$dossier/index.html"
          done
          node --test tests/data.test.mjs tests/research.test.mjs tests/profiles.test.mjs tests/commentary.test.mjs tests/site-shell.test.mjs
          mkdir -p dist/client/about
          cp dist/client/about.html dist/client/about/index.html
          cp CNAME dist/client/CNAME
          touch dist/client/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
